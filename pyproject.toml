[project]
name = "abase"
version = "0.1.0"
description = "Shared knowledge base and coordination system for Amir's coding agents."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
